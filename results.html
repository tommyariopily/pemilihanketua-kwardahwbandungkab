<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hasil Pemilihan — Pemilihan Ketua Kwarda HW Kabupaten Bandung</title>
<link rel="icon" href="assets/logo-hw.png">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/responsive.css">
</head>
<body>
<div class="page">
  <header class="topbar">
    <img class="logo" src="assets/logo-hw.png" alt="Logo Hizbul Wathan">
    <div class="brand">Pemilihan Ketua Kwarda HW<small>Kabupaten Bandung</small></div>
  </header>

  <main class="narrow">
    <h2 class="center">Hasil Pemilihan Ketua Kwarda HW Kabupaten Bandung</h2>

    <div id="publicResultsNotice" class="info-box hidden">Hasil pemilihan akan ditampilkan setelah pemungutan suara resmi ditutup.</div>

    <div class="card" id="publicResultsCard">
      <div id="publicResultsList"><p class="muted center">Memuat hasil...</p></div>
      <p class="result-meta center" id="publicResultsTotal"></p>
    </div>

    <a href="index.html" class="btn btn-outline btn-block mt-16">KEMBALI KE BERANDA</a>
  </main>

  <footer class="footer">Kwartir Daerah Hizbul Wathan Kabupaten Bandung</footer>
</div>

<script src="config.js" onerror="document.write('&lt;script src=\'config.example.js\'&gt;&lt;/script&gt;')"></script>
<script src="js/app.js"></script>
<script>
  APP.call('getResults', {}, { silent: true, silentError: true }).then(function (res) {
    if (!res.resultsVisible) {
      document.getElementById('publicResultsNotice').classList.remove('hidden');
      document.getElementById('publicResultsCard').classList.add('hidden');
      return;
    }
    const total = res.totalVotes || 0;
    document.getElementById('publicResultsList').innerHTML = res.candidates.map(function (c) {
      const pct = total > 0 ? ((c.voteCount / total) * 100).toFixed(2) : '0.00';
      return '<div class="result-row">' +
        '<div class="result-head"><span class="name">' + APP.escapeHtml(c.number) + ' — ' + APP.escapeHtml(c.name) + '</span>' +
        '<span class="pct">' + pct + '%</span></div>' +
        '<div class="bar-track"><div class="bar-fill" style="width:' + pct + '%"></div></div>' +
        '<div class="result-meta">Jumlah suara: ' + c.voteCount + '</div></div>';
    }).join('');
    document.getElementById('publicResultsTotal').textContent = 'Total suara masuk: ' + total;
  }).catch(function () {
    document.getElementById('publicResultsList').innerHTML = '<p class="muted center">Hasil belum tersedia.</p>';
  });
</script>
</body>
</html>
